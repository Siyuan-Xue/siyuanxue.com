server {
	listen 80;
	listen [::]:80;
	server_name xuesiyuan.com www.xuesiyuan.com;
	location ^~ /.well-known/acme-challenge/ {
		root /var/lib/letsencrypt;
		default_type text/plain;
		try_files $uri =404;
	}
	location / { return 301 https://xuesiyuan.com$request_uri; }
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name www.xuesiyuan.com;
	ssl_certificate /etc/letsencrypt/live/xuesiyuan.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/xuesiyuan.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	return 301 https://xuesiyuan.com$request_uri;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name xuesiyuan.com;

	root /var/www/siyuanxue.com/current/zh;
	index index.html;
	include /etc/nginx/snippets/hermes-chat.conf;

	ssl_certificate /etc/letsencrypt/live/xuesiyuan.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/xuesiyuan.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 10m;
	ssl_session_tickets off;

	access_log /var/log/nginx/siyuanxue.access.log;
	error_log /var/log/nginx/siyuanxue.error.log warn;

	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types
		application/javascript
		application/json
		application/xml
		image/svg+xml
		text/css
		text/plain
		text/xml;

	location = /__health {
		default_type text/plain;
		try_files /__health =404;
		add_header Cache-Control "no-store, no-cache, must-revalidate" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	}

	location ^~ /_astro/ {
		root /var/www/siyuanxue.com/shared;
		try_files $uri =404;
		expires 1y;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	}

	location = /images/p-202.jpg { return 410; }
	error_page 404 /404.html;

	location / {
		try_files $uri $uri/ $uri.html =404;
		add_header Cache-Control "no-cache" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	}
}
