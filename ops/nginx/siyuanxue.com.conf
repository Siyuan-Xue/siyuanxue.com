server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	root /var/www/siyuanxue.com/current;

	location = /__health {
		default_type text/plain;
		try_files /__health =404;
		add_header Cache-Control "no-store, no-cache, must-revalidate" always;
	}

	location / {
		return 444;
	}
}

server {
	listen 80;
	listen [::]:80;
	server_name 82.156.77.131;

	root /var/www/siyuanxue.com/current;
	index index.html;

	access_log /var/log/nginx/siyuanxue.access.log;
	error_log /var/log/nginx/siyuanxue.error.log warn;

	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types
		application/javascript
		application/json
		application/xml
		image/svg+xml
		text/css
		text/plain
		text/xml;

	location = /__health {
		default_type text/plain;
		try_files /__health =404;
		add_header Cache-Control "no-store, no-cache, must-revalidate" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	}

	location ^~ /_astro/ {
		try_files $uri =404;
		expires 1y;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	}

	location / {
		try_files $uri $uri/ $uri.html =404;
		add_header Cache-Control "no-cache" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	}
}

server {
	listen 80;
	listen [::]:80;
	server_name siyuanxue.com www.siyuanxue.com;

	location ^~ /.well-known/acme-challenge/ {
		root /var/lib/letsencrypt;
		default_type text/plain;
		try_files $uri =404;
	}

	location / {
		return 301 https://siyuanxue.com$request_uri;
	}
}

server {
	listen 443 ssl http2 default_server;
	listen [::]:443 ssl http2 default_server;
	server_name _;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_reject_handshake on;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name www.siyuanxue.com;

	ssl_certificate /etc/letsencrypt/live/siyuanxue.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/siyuanxue.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 10m;
	ssl_session_tickets off;

	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

	return 301 https://siyuanxue.com$request_uri;
}

