# Documentation-only partial overlay for the wechat-public Hermes profile.
# Audited against official Hermes v0.21.1. Merge these keys into the backed-up
# profile; do not replace the complete config.yaml with this file.
# Every value shown is authoritative for that listed path: replace the listed
# lists and maps, including mcp_servers, instead of recursively retaining items.
#
# Deliberately omitted: model/provider configuration, credentials, platform
# identity IDs, login/transport settings, disabled skills, session/log settings,
# and every unrelated profile field. Preserve those values while applying this
# overlay.

timezone: Asia/Shanghai

agent:
  reasoning_effort: high
  max_turns: 4
  run_budget_seconds: 120
  disabled_toolsets:
    - kanban
    - context_engine

context:
  engine: compressor

# Native public-profile memory writes are off; plugin shared-memory reads stay on.
memory:
  memory_enabled: false
  user_profile_enabled: false

auxiliary:
  background_review:
    enabled: false

skills:
  creation_nudge_interval: 0
  write_approval: true

curator:
  enabled: false

plugins:
  enabled:
    - website-readonly

# Keep the eight reviewed readers directly visible to the model. Native auto
# defers plugin schemas behind tool_search/tool_describe/tool_call bridges.
tools:
  tool_search:
    enabled: "off"

platform_toolsets:
  api_server: []
  cli: []
  weixin:
    - web
    - website_readonly
    - no_mcp

mcp_servers: {}

web:
  search_backend: tavily
  extract_backend: tavily
  provider_tier:
    tavily: free
  keyless_fallback: true
  keyless_rescue: true
