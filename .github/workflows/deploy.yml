name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy main or roll back to a retained release
        type: choice
        options:
          - deploy
          - rollback
        default: deploy
        required: true
      migrate_domains:
        description: One-time bilingual cutover after administrator preparation
        type: boolean
        default: false
        required: false
      rollback_sha:
        description: Full 40-character commit SHA; required for rollback
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    if: github.event_name == 'push' || inputs.operation == 'deploy'
    uses: ./.github/workflows/ci.yml
  deploy:
    name: Deploy verified release
    needs: verify
    if: github.event_name == 'push' || inputs.operation == 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      ARCHIVE_NAME: ${{ needs.verify.outputs.archive_name }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
      DEPLOY_ORIGIN: ${{ vars.DEPLOY_ORIGIN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Validate production configuration
        run: |
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          (( DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535 ))
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_ROOT" == /var/www/siyuanxue.com ]]
          case "$DEPLOY_ORIGIN" in
            https://siyuanxue.com) ;;
            *) exit 1 ;;
          esac

      - name: Download verified release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
      - name: Check release checksum
        run: sha256sum -c "$ARCHIVE_NAME.sha256"

      - name: Configure strict SSH authentication
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/ssh/deploy_key" "$RUNNER_TEMP/ssh/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/ssh/deploy_key" >/dev/null

      - name: Upload release archive
        run: |
          scp \
            -i "$RUNNER_TEMP/ssh/deploy_key" \
            -P "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            "$ARCHIVE_NAME" "$ARCHIVE_NAME.sha256" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/incoming/"

      - name: Activate release
        id: activate
        run: |
          ssh \
            -i "$RUNNER_TEMP/ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            /usr/local/bin/siyuanxue-release activate \
            "$DEPLOY_ROOT" "$GITHUB_SHA" "$ARCHIVE_NAME" \
            http://127.0.0.1/__health

      - name: Apply prepared domain migration
        if: github.event_name == 'workflow_dispatch' && inputs.migrate_domains
        run: |
          ssh -i "$RUNNER_TEMP/ssh/deploy_key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" sudo -n /usr/local/sbin/siyuanxue-domain-migration apply

      - name: Verify both public locales
        run: bash ops/verify-public.sh "$GITHUB_SHA"

      - name: Restore previous release after failed public check
        if: failure() && steps.activate.outcome == 'success' && !inputs.migrate_domains
        run: |
          restored_sha=$(ssh \
            -i "$RUNNER_TEMP/ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            /usr/local/bin/siyuanxue-release restore-previous \
            "$DEPLOY_ROOT" "$GITHUB_SHA" http://127.0.0.1/__health)
          bash ops/verify-public.sh "$restored_sha"

      - name: Restore initial migration baseline after failure
        if: failure() && steps.activate.outcome == 'success' && inputs.migrate_domains
        run: |
          ssh -i "$RUNNER_TEMP/ssh/deploy_key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" sudo -n /usr/local/sbin/siyuanxue-domain-migration restore

      - name: Finalize successful release
        run: |
          ssh \
            -i "$RUNNER_TEMP/ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            /usr/local/bin/siyuanxue-release finalize \
            "$DEPLOY_ROOT" "$GITHUB_SHA" 5

      - name: Complete domain migration and remove temporary privilege
        if: github.event_name == 'workflow_dispatch' && inputs.migrate_domains
        run: |
          ssh -i "$RUNNER_TEMP/ssh/deploy_key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" sudo -n /usr/local/sbin/siyuanxue-domain-migration finish

      - name: Remove temporary SSH material
        if: always()
        run: rm -f "$RUNNER_TEMP/ssh/deploy_key" "$RUNNER_TEMP/ssh/known_hosts"

  rollback:
    name: Roll back production
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
      DEPLOY_ORIGIN: ${{ vars.DEPLOY_ORIGIN }}
      ROLLBACK_SHA: ${{ inputs.rollback_sha }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Validate rollback request
        run: |
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          (( DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535 ))
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_ROOT" == /var/www/siyuanxue.com ]]
          case "$DEPLOY_ORIGIN" in
            https://siyuanxue.com) ;;
            *) exit 1 ;;
          esac
          [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Configure strict SSH authentication
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/ssh/deploy_key" "$RUNNER_TEMP/ssh/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/ssh/deploy_key" >/dev/null

      - name: Activate retained release
        id: activate
        run: |
          ssh \
            -i "$RUNNER_TEMP/ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            /usr/local/bin/siyuanxue-release rollback \
            "$DEPLOY_ROOT" "$ROLLBACK_SHA" http://127.0.0.1/__health

      - name: Verify both public locales after rollback
        run: bash ops/verify-public.sh "$ROLLBACK_SHA"

      - name: Undo rollback after failed public check
        if: failure() && steps.activate.outcome == 'success'
        run: |
          restored_sha=$(ssh \
            -i "$RUNNER_TEMP/ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            /usr/local/bin/siyuanxue-release restore-previous \
            "$DEPLOY_ROOT" "$ROLLBACK_SHA" http://127.0.0.1/__health)
          bash ops/verify-public.sh "$restored_sha"

      - name: Finalize rollback
        run: |
          ssh \
            -i "$RUNNER_TEMP/ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            /usr/local/bin/siyuanxue-release finalize \
            "$DEPLOY_ROOT" "$ROLLBACK_SHA" 5

      - name: Remove temporary SSH material
        if: always()
        run: rm -f "$RUNNER_TEMP/ssh/deploy_key" "$RUNNER_TEMP/ssh/known_hosts"
